<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Nippon Gear: The 30-Year Service Loop</title>
  <desc id="desc">JII Compounder Profile social image showing how a critical actuator creates decades of service.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c30"/><stop offset="1" stop-color="#1c3152"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop stop-color="#b7cc45" stop-opacity=".22"/><stop offset="1" stop-color="#b7cc45" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#08111f" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="14" height="630" fill="#a8bc35"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="70" fill="#dfe8a6" font-size="18" font-weight="700" letter-spacing="5">JII · COMPOUNDER PROFILE</text>
    <text x="72" y="134" fill="#ffffff" font-size="24" font-weight="700" letter-spacing="3">6356  NIPPON GEAR</text>
    <text x="72" y="207" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="61" font-weight="400">The 30-Year</text>
    <text x="72" y="276" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="61" font-weight="400">Service Loop</text>
    <text x="75" y="324" fill="#bec9d8" font-size="21">Sell a critical actuator once. Inspect, diagnose,</text>
    <text x="75" y="354" fill="#bec9d8" font-size="21">repair and supply it for decades.</text>

    <g transform="translate(72 420)">
      <line x1="0" y1="-24" x2="505" y2="-24" stroke="#ffffff" stroke-opacity=".18"/>
      <g><text y="0" fill="#ffffff" font-family="Georgia, serif" font-size="34">32.5%</text><text y="29" fill="#9faec1" font-size="13" letter-spacing="2">SERVICE OP MARGIN</text></g>
      <g transform="translate(182)"><text y="0" fill="#ffffff" font-family="Georgia, serif" font-size="34">4.69x</text><text y="29" fill="#9faec1" font-size="13" letter-spacing="2">GUIDED EV / OP</text></g>
      <g transform="translate(357)"><text y="0" fill="#ffffff" font-family="Georgia, serif" font-size="34">36.6%</text><text y="29" fill="#9faec1" font-size="13" letter-spacing="2">NET CASH / MC</text></g>
    </g>
    <text x="72" y="582" fill="#778aa3" font-size="15" letter-spacing="2">AUGUST 22, 2026  ·  JPINV.COM</text>
  </g>

  <g transform="translate(891 314)" filter="url(#shadow)">
    <circle r="240" fill="url(#glow)"/>
    <circle r="174" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="1"/>
    <circle r="133" fill="#8da322"/>
    <circle r="104" fill="#172641" stroke="#c7d766" stroke-width="2"/>
    <text y="-34" text-anchor="middle" fill="#dfe8a6" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">ONE SALE</text>
    <text y="6" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="28">decades of</text>
    <text y="42" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="36">service</text>

    <g font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3" fill="#ffffff">
      <g transform="translate(0 -174)"><circle r="30" fill="#243b5e" stroke="#b7cc45" stroke-width="2"/><text y="4" text-anchor="middle">SELL</text></g>
      <g transform="translate(166 -54)"><circle r="38" fill="#243b5e" stroke="#b7cc45" stroke-width="2"/><text y="-3" text-anchor="middle">INSTALLED</text><text y="13" text-anchor="middle">BASE</text></g>
      <g transform="translate(103 141)"><circle r="38" fill="#243b5e" stroke="#b7cc45" stroke-width="2"/><text y="-3" text-anchor="middle">INSPECT</text><text y="13" text-anchor="middle">DIAGNOSE</text></g>
      <g transform="translate(-103 141)"><circle r="38" fill="#243b5e" stroke="#b7cc45" stroke-width="2"/><text y="-3" text-anchor="middle">PARTS</text><text y="13" text-anchor="middle">REPAIR</text></g>
      <g transform="translate(-166 -54)"><circle r="38" fill="#243b5e" stroke="#b7cc45" stroke-width="2"/><text y="-3" text-anchor="middle">EXTEND</text><text y="13" text-anchor="middle">LIFE</text></g>
    </g>
    <path d="M31-170A174 174 0 0 1 155-80" fill="none" stroke="#dfe8a6" stroke-width="3" stroke-linecap="round"/>
    <path d="M169-29A174 174 0 0 1 126 120" fill="none" stroke="#dfe8a6" stroke-width="3" stroke-linecap="round"/>
    <path d="M76 157A174 174 0 0 1-73 158" fill="none" stroke="#dfe8a6" stroke-width="3" stroke-linecap="round"/>
    <path d="M-126 120A174 174 0 0 1-169-27" fill="none" stroke="#dfe8a6" stroke-width="3" stroke-linecap="round"/>
    <path d="M-156-77A174 174 0 0 1-32-170" fill="none" stroke="#dfe8a6" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
