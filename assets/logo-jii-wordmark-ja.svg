<!-- The Japanese legal name needs a wider canvas than the English wordmark.
     At the header's 32px rendered height, this 1085:100 canvas is 347.2px wide
     and the 40.625-unit label renders at 13px. The monogram uses the same paths
     and transform as the English asset, so the two language versions align. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1085" height="100" viewBox="0 0 1085 100" role="img" aria-labelledby="t d">
  <title id="t">株式会社ジャパン・インベスター・インターフェース ロゴ</title>
  <desc id="d">紺色のドア枠と開いた金色のドアのマークに、株式会社ジャパン・インベスター・インターフェースの社名を組み合わせたロゴ。</desc>
  <g transform="translate(6,10) scale(0.8)"><path fill="#1a2a4a" d="M8,4 H92 V96 H66 V30 H34 V96 H8 Z"/><path fill="#b08a4a" d="M44 32 L62 26 L62 96 L44 88 Z"/></g>
  <text x="106" y="64" fill="#1a2a4a" font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif" font-size="40.625" font-weight="400" letter-spacing=".01em">株式会社ジャパン・インベスター・インターフェース</text>
</svg>
