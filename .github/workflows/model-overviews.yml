name: Forecast overview presentation
on:
  push:
    paths:
      - 'en/models/**'
      - 'tools/build-model-overviews.py'
      - '.github/workflows/model-overviews.yml'
  pull_request:
    paths:
      - 'en/models/**'
      - 'tools/build-model-overviews.py'
      - '.github/workflows/model-overviews.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.12.3
      - run: python tools/build-model-overviews.py --check
