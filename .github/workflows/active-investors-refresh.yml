name: active-investors-refresh

# Active Investors in Japan (JII Compounders).
# Daily: pull recent EDINET large-shareholding filings, refresh the 9 curated
# investor cards AND the TSE-wide "new 5%" feed, commit the JSON under
# compounders/active-investors/data/. Docs: tools/active_investors/README.md.

on:
  schedule:
    - cron: '0 22 * * *'   # 22:00 UTC daily (~07:00 JST) — after the JST filing day
  workflow_dispatch:
    inputs:
      days:
        description: 'Live look-back window in days (cards).'
        required: false
        default: '7'
      new5_days:
        description: 'Look-back window in days (new-5% feed).'
        required: false
        default: '5'

permissions:
  contents: write

concurrency:
  group: active-investors-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh active-investor cards + new-5% feed
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (Claude tier; core is stdlib-only)
        timeout-minutes: 3
        run: pip install --disable-pip-version-check -r tools/active_investors/requirements.txt || true

      - name: Refresh the 9 investor cards (live EDINET)
        timeout-minutes: 12
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python tools/active_investors/refresh.py --days "${{ github.event.inputs.days || '7' }}"

      - name: Refresh the TSE-wide new-5% feed
        timeout-minutes: 8
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python tools/active_investors/new5_feed.py --days "${{ github.event.inputs.new5_days || '5' }}" --max-downloads 150

      - name: Update 12-month filer tally + active-fund roster
        timeout-minutes: 6
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          python tools/active_investors/rank_filers.py --start "$(date -u -d '365 days ago' +%F)" --end "$(date -u +%F)" --max-seconds 240
          python tools/active_investors/build_roster.py

      - name: Commit and push refreshed data
        run: |
          set -euo pipefail
          # Stage EVERY tracked file the scripts rewrite. .summary_cache.json is
          # tracked and rewritten by refresh.py on every run; leaving it out of the
          # commit left it as an UNSTAGED change, which made `git rebase` abort with
          # "cannot rebase: You have unstaged changes." on the retry path below —
          # the real cause of the daily "Run failed" emails (Jun–Jul 2026). It must
          # be in $paths so the working tree is clean before any rebase.
          paths="compounders/active-investors/data/ tools/active_investors/.llm_ledger.json tools/active_investors/.filer_tally.json tools/active_investors/.summary_cache.json"
          if [ -z "$(git status --porcelain $paths)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name  "jii-active-investors-bot"
          git config user.email "active-investors-bot@users.noreply.github.com"
          git add $paths
          git commit -m "active-investors: refresh @ ${{ github.run_id }}"
          # The feed-refresh workflow runs every 30 min and also pushes to main.
          # This job takes ~8 min, so a feed push can land mid-run and make a plain
          # `git push` fail with a non-fast-forward rejection — the cause of the
          # intermittent "Run failed" emails (e.g. 2026-06-22, 2026-06-27). Rebase
          # our single data commit onto the latest main and retry. Our paths
          # (compounders/active-investors/, tools/active_investors/) are disjoint
          # from feed-refresh's, so the rebase never conflicts.
          #
          # --autostash makes the rebase resilient to ANY stray unstaged change
          # (e.g. a newly generated file a future script writes that isn't in
          # $paths yet): git stashes it, rebases, then reapplies it, instead of
          # aborting. `|| git rebase --abort` guarantees we never re-enter the loop
          # mid-rebase. Together these make the push robust "for good".
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} rejected; rebasing onto latest origin/main and retrying..."
            git fetch origin main
            git rebase --autostash origin/main || { git rebase --abort || true; }
          done
          echo "Push still failing after 5 attempts." >&2
          exit 1
