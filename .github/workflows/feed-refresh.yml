name: feed-refresh

# JII Compounders -- Capital-Allocation Inflection Feed
# Polls TDnet every 30 min, runs the classifier,
# appends new matches to compounders/feed/data/*.json, and pushes back to main.
# Spec: compounders/feed/_SPEC.md, sections 3, 4, 8.

on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled runs under heavy load;
    # the refresh script is idempotent so late catch-ups are safe.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Manual trigger -- exposed as a "Run workflow" button in the Actions tab.

permissions:
  contents: write    # so the job can commit and push the refreshed JSON

concurrency:
  # Never let two refresh runs race each other -- newer one wins.
  group: feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Poll disclosures and append new matches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Need full token persistence so the later push step can write back.
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        timeout-minutes: 3
        run: |
          set -euo pipefail
          if [ -f tools/requirements.txt ]; then
            pip install --disable-pip-version-check -r tools/requirements.txt
          else
            echo "tools/requirements.txt missing -- falling back to inline install"
            pip install --disable-pip-version-check requests beautifulsoup4 lxml
          fi

      - name: Run feed_refresh.py
        id: refresh
        timeout-minutes: 10
        continue-on-error: false
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python tools/feed_refresh.py

      - name: Scrub sample signals + rebuild join + signal pages
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # Remove any leftover EDINET-SAMPLE placeholder signals from feed.json + the
          # per-ticker archives (a one-time backfill artifact; runs server-side here where
          # feed.json is fully hydrated). Then join the fresh feed to the watchlist and
          # regenerate the per-name signal pages. All three are deterministic/idempotent:
          # identical inputs produce identical bytes, so unchanged data makes no git diff.
          python tools/scrub_sample_signals.py
          python tools/watchlist_join.py
          python tools/build_signal_pages.py
          # The homepage hero reads a small hero.json rather than the 2MB feed.
          # It must be rebuilt here or the hero goes stale while the feed moves.
          # --no-bake because this job stages only compounders/feed/data/ and the
          # signal pages: anything written into index.html here is discarded, and
          # staging it instead would have a bot editing a file Teddy edits by hand
          # every 30 minutes. The baked rows are the no-JavaScript fallback and are
          # refreshed when the site is built, not on this schedule.
          python tools/build_hero_data.py --no-bake

      - name: Check for changes under compounders/feed/data/
        id: diff
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain compounders/feed/data/ compounders/signals/ en/compounders/signals/ tools/llm_ledger.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # Best-effort count of newly-added rows in feed.json for the run summary.
            # Counts lines starting with the row id sentinel; tolerates missing files.
            added=$(git diff --unified=0 -- compounders/feed/data/feed.json 2>/dev/null | grep -cE '^\+\s*"id":' || true)
            echo "added=${added:-0}" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "added=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push refreshed data
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "jii-feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          # Persist the LLM budget ledger so the $9 month-to-date cap in
          # tools/llm_budget.py accumulates ACROSS runs. Without this the ledger
          # was never committed back, so every run reloaded the stale (last
          # month's) copy, reset it to $0, and the cap was never really enforced.
          git add compounders/feed/data/ compounders/signals/ en/compounders/signals/ tools/llm_ledger.json
          git commit -m "feed: refresh @ ${{ github.run_id }}"
          # active-investors-refresh (and the next feed run) also push to main, so a
          # plain `git push` can be rejected (non-fast-forward) when main moves
          # mid-run. Rebase our data commit onto the latest main and retry. Our paths
          # (compounders/feed/, compounders/signals/, tools/llm_ledger.json) are
          # disjoint from active-investors-refresh's, so the rebase never conflicts.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} rejected; rebasing onto latest origin/main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Push still failing after 5 attempts." >&2
          exit 1

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Feed refresh"
            echo ""
            echo "- changed: ${{ steps.diff.outputs.changed }}"
            echo "- new rows appended: ${{ steps.diff.outputs.added }}"
            echo "- run id: ${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
