name: feed-refresh

# JII Compounders -- Capital-Allocation Inflection Feed
# Polls TDnet every 30 min, runs the classifier,
# appends new matches to compounders/feed/data/*.json, and pushes back to main.
# Spec: compounders/feed/_SPEC.md, sections 3, 4, 8.

on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled runs under heavy load;
    # the refresh script is idempotent so late catch-ups are safe.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Manual trigger -- exposed as a "Run workflow" button in the Actions tab.

permissions:
  contents: write    # so the job can commit and push the refreshed JSON

concurrency:
  # Never let two refresh runs race each other -- newer one wins.
  group: feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Poll disclosures and append new matches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Need full token persistence so the later push step can write back.
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        timeout-minutes: 3
        run: |
          set -euo pipefail
          if [ -f tools/requirements.txt ]; then
            pip install --disable-pip-version-check -r tools/requirements.txt
          else
            echo "tools/requirements.txt missing -- falling back to inline install"
            pip install --disable-pip-version-check requests beautifulsoup4 lxml
          fi

      - name: Check the scripts this job runs for undefined names
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # Why this step exists. On August 3, 2026 tools/build_hero_data.py was
          # committed with a reference to `sys.argv` and no `import sys`. That
          # line sits behind the `--no-bake` flag, and this workflow is the only
          # thing that passes that flag, so running the script by hand never
          # reached the line. Seven scheduled runs in a row then died on it and
          # the feed stopped updating for eleven hours.
          #
          # pyflakes reads each file and reports names that are used but never
          # defined. That is exactly the defect above, and the check takes about
          # a second. Only "undefined name" fails the job. Style findings such as
          # an unused import are printed and then ignored, so a cosmetic warning
          # can never stop the feed from refreshing.
          pip install --disable-pip-version-check --quiet pyflakes
          python -m pyflakes \
            tools/feed_refresh.py tools/classifier.py tools/pdf_enricher.py \
            tools/llm_budget.py tools/tdnet_scraper.py tools/jpx_master.py \
            tools/scrub_sample_signals.py tools/watchlist_join.py \
            tools/build_signal_pages.py tools/build_hero_data.py \
            tools/build_news_data.py > pyflakes.txt 2>&1 || true
          cat pyflakes.txt
          if grep -q "undefined name" pyflakes.txt; then
            echo "::error::A script this job runs uses a name it never defines."
            exit 1
          fi
          rm -f pyflakes.txt

      - name: Run feed_refresh.py
        id: refresh
        timeout-minutes: 10
        continue-on-error: false
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python tools/feed_refresh.py

      - name: Scrub sample signals + rebuild join + signal pages
        id: rebuild
        timeout-minutes: 3
        run: |
          # NOTE: `set -e` is deliberately absent here. Every other step in this
          # file uses it. This one must not, for the reason in the next comment.
          set -uo pipefail

          # Each script below turns the feed that the previous step just wrote
          # into something derived from it: cleaned archives, the watchlist join,
          # the per-name signal pages, the homepage hero file, the news file.
          # They are deterministic and idempotent, so identical inputs produce
          # identical bytes and unchanged data makes no git diff.
          #
          # Until August 3, 2026 this step ran them under `set -e`, so the first
          # script to fail ended the step, and the commit step below is skipped
          # when an earlier step fails. The feed itself had already been fetched,
          # classified and written to disk at that point. It was then thrown away
          # with the runner. A one-line crash in the homepage hero file, which
          # nothing depends on, froze the live feed for eleven hours.
          #
          # So each script now runs on its own and a failure is recorded rather
          # than raised. Whatever was produced still gets committed, the run
          # still ends in failure, and the notification email still arrives --
          # the last step in this file reads the record below and exits 1.
          failed=""
          run_script() {
            echo "::group::$1"
            if python "$@"; then
              echo "$1 ok"
            else
              echo "::error::$1 failed"
              failed="${failed}${failed:+, }$1"
            fi
            echo "::endgroup::"
          }

          # Remove any leftover EDINET-SAMPLE placeholder signals from feed.json
          # and the per-ticker archives (a one-time backfill artifact; it runs
          # server-side here, where feed.json is fully hydrated).
          run_script tools/scrub_sample_signals.py
          # Join the fresh feed to the watchlist, then regenerate the per-name
          # signal pages from that join.
          run_script tools/watchlist_join.py
          run_script tools/build_signal_pages.py
          # The homepage hero reads a small hero.json rather than the 2MB feed.
          # It must be rebuilt here or the hero goes stale while the feed moves.
          # --no-bake because this job stages only compounders/feed/data/ and the
          # signal pages: anything written into index.html here is discarded, and
          # staging it instead would have a bot editing a file Teddy edits by hand
          # every 30 minutes. The baked rows are the no-JavaScript fallback and are
          # refreshed when the site is built, not on this schedule.
          run_script tools/build_hero_data.py --no-bake
          run_script tools/build_news_data.py --no-bake

          echo "failed=${failed}" >> "$GITHUB_OUTPUT"

      - name: Check for changes under compounders/feed/data/
        id: diff
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain compounders/feed/data/ compounders/signals/ en/compounders/signals/ tools/llm_ledger.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # Best-effort count of newly-added rows in feed.json for the run summary.
            # Counts lines starting with the row id sentinel; tolerates missing files.
            added=$(git diff --unified=0 -- compounders/feed/data/feed.json 2>/dev/null | grep -cE '^\+\s*"id":' || true)
            echo "added=${added:-0}" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "added=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push refreshed data
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "jii-feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          # Persist the LLM budget ledger so the $9 month-to-date cap in
          # tools/llm_budget.py accumulates ACROSS runs. Without this the ledger
          # was never committed back, so every run reloaded the stale (last
          # month's) copy, reset it to $0, and the cap was never really enforced.
          git add compounders/feed/data/ compounders/signals/ en/compounders/signals/ tools/llm_ledger.json
          git commit -m "feed: refresh @ ${{ github.run_id }}"
          # active-investors-refresh (and the next feed run) also push to main, so a
          # plain `git push` can be rejected (non-fast-forward) when main moves
          # mid-run. Rebase our data commit onto the latest main and retry. Our paths
          # (compounders/feed/, compounders/signals/, tools/llm_ledger.json) are
          # disjoint from active-investors-refresh's, so the rebase never conflicts.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} rejected; rebasing onto latest origin/main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Push still failing after 5 attempts." >&2
          exit 1

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Feed refresh"
            echo ""
            echo "- changed: ${{ steps.diff.outputs.changed }}"
            echo "- new rows appended: ${{ steps.diff.outputs.added }}"
            echo "- rebuild scripts that failed: ${{ steps.rebuild.outputs.failed }}"
            echo "- run id: ${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # This runs last so that the data is already committed and the summary is
      # already written by the time the job is marked failed. A failed rebuild
      # script must still send the notification email; it just must not take the
      # feed down with it.
      - name: Fail the run if a rebuild script failed
        if: always() && steps.rebuild.outputs.failed != ''
        run: |
          echo "::error::Rebuild scripts that failed: ${{ steps.rebuild.outputs.failed }}"
          echo "The feed data written before the failure was committed anyway." >&2
          exit 1
