name: Compounder visual-first structure

on:
  pull_request:
    paths:
      - "index.html"
      - "en/index.html"
      - "content/compounders/profile-data.json"
      - "compounders/feed/data/news.json"
      - "tools/build_news_data.py"
      - "tools/build-compounder-home-news.mjs"
      - "tools/check-compounder-home-news.mjs"
      - "tools/lib/compounder-home-news.mjs"
      - "compounders/index.html"
      - "compounders/profiles/index.html"
      - "en/compounders/index.html"
      - "en/compounders/profiles/index.html"
      - "compounders/**/initiation/index.html"
      - "en/compounders/**/initiation/index.html"
      - "assets/compounder-research.css"
      - "assets/compounder-research.js"
      - "assets/share-bar.js"
      - "assets/nav.js"
      - "tools/check-compounder-visual-first.mjs"
      - "tools/check-compounder-hub-recency.mjs"
      - ".github/workflows/compounder-visual-first.yml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "en/index.html"
      - "content/compounders/profile-data.json"
      - "compounders/feed/data/news.json"
      - "tools/build_news_data.py"
      - "tools/build-compounder-home-news.mjs"
      - "tools/check-compounder-home-news.mjs"
      - "tools/lib/compounder-home-news.mjs"
      - "compounders/index.html"
      - "compounders/profiles/index.html"
      - "en/compounders/index.html"
      - "en/compounders/profiles/index.html"
      - "compounders/**/initiation/index.html"
      - "en/compounders/**/initiation/index.html"
      - "assets/compounder-research.css"
      - "assets/compounder-research.js"
      - "assets/share-bar.js"
      - "assets/nav.js"
      - "tools/check-compounder-visual-first.mjs"
      - "tools/check-compounder-hub-recency.mjs"
      - ".github/workflows/compounder-visual-first.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  visual-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check-compounder-visual-first.mjs
      - run: node tools/check-compounder-hub-recency.mjs
      - run: node tools/check-compounder-home-news.mjs
