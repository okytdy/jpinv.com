name: English content parity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python3 tools/test_signal_disclaimer_parity.py
      - run: npm run check:english-parity
      - run: npm run check:indexing
